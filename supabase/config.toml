project_id = "moy-prihod"
[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 100
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[realtime]
enabled = true
[studio]
enabled = true
port = 54323
[auth]
enabled = true
site_url = "http://localhost:8080"
additional_redirect_urls = ["http://localhost:8080/", "org.moyprihod.app://login-callback/"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 12
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "60s"
otp_expiry = 900
otp_length = 8
[auth.sms]
enable_signup = false

[auth.email.template.confirmation]
subject = "Mellon — подтверждение почты"
content_path = "./supabase/templates/confirmation.html"
[auth.email.template.recovery]
subject = "Mellon — восстановление пароля"
content_path = "./supabase/templates/recovery.html"
